# Reverse proxy for the tarot-bot Telegram webhook.
#
# Deliberately listens on 8443 (a Telegram-allowed webhook port), NOT 443.
# This means it never conflicts with, and never needs to know anything
# about, whatever else (e.g. Xray/3X-UI) is already bound to 443 on this
# host. No coordination with that service is required.
#
# Prerequisite: a TLS cert for the domain, e.g. via:
#   certbot certonly --nginx -d amirxo.com
# (uses port 80 for the HTTP-01 challenge; unrelated to 443 or 8443 above.
#  If port 80 is also unavailable, use certbot's DNS-01 challenge instead.)

server {
    listen 80;
    listen [::]:80;
    server_name amirxo.com;

    # Required for certbot's HTTP-01 challenge / renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}

server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name amirxo.com;

    ssl_certificate     /etc/letsencrypt/live/amirxo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amirxo.com/privkey.pem;

    # Must match WEBHOOK_PATH in tarot-bot/.env exactly.
    location /webhook/tarot-bot-CHANGE-ME {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else on this port: 404 (don't proxy random paths to the bot).
    location / {
        return 404;
    }
}
