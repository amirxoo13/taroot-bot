name: deploy-tarot-bot

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust host key
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sync code and restart tarot-bot
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude '.git' --exclude '.venv' --exclude '.env' --exclude 'assets/cards' --exclude '__pycache__' \
            tarot-bot/ "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/tarot-bot/"
          rsync -az --delete \
            --exclude '.git' --exclude '__pycache__' \
            tarot/ "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/tarot/"
          printf '%s\n' "$ENV_FILE" | ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'cat > /opt/tarot-bot/.env && chmod 600 /opt/tarot-bot/.env'
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'sudo systemctl restart tarot-bot && sudo systemctl is-active tarot-bot'
